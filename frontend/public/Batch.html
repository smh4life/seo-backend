<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Batch Generator | MySCOGenerator</title>

<style>
body {
  margin: 0;
  font-family: "Inter", Arial, sans-serif;
  background: url("ai-wave.jpg") no-repeat center center/cover;
  color: #f5f5f5;
}

/* ===================== HEADER ===================== */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  height: 70px;
  padding: 0 40px;
  background: rgba(25,20,40,0.95);
  border-bottom: 1px solid #2b2d33;
  position: sticky;
  top: 0;
  z-index: 10;
  backdrop-filter: blur(10px);
  box-shadow: 0 0 25px rgba(0,153,255,0.25);
  animation: headerGlow 6s ease-in-out infinite alternate;
}
@keyframes headerGlow {
  0% { box-shadow: 0 0 20px rgba(0,153,255,0.25); }
  50% { box-shadow: 0 0 40px rgba(0,180,255,0.55); }
  100% { box-shadow: 0 0 25px rgba(0,153,255,0.25); }
}

header img { height:50px; filter:drop-shadow(0 0 14px rgba(255,255,255,0.7)); }
header h1 { color:white; margin-left:18px; font-size:1.6rem; }
nav a { color:#f5f5f5; margin-left:30px; text-decoration:none; }
nav a:hover { color:#69b7ff; }

.card {
  background:rgba(40,42,55,0.7);
  border-radius:14px; padding:40px;
  width:90%; max-width:900px;
  margin:80px auto;
  box-shadow:0 0 25px rgba(100,180,255,0.25);
  border:1px solid rgba(100,180,255,0.4);
  backdrop-filter:blur(10px);
}

textarea {
  width:100%; height:140px;
  padding:14px; border-radius:8px;
  background:rgba(20,20,30,0.95);
  border:1px solid rgba(100,180,255,0.4);
  color:white; resize:none; font-size:1rem;
}

.pixel-row {
  display:flex; justify-content:center;
  gap:30px; margin:20px 0;
}
.pixel-box label { font-weight:600; color:#69b7ff; }
.pixel-box input {
  width:160px; text-align:center;
  padding:10px; background:rgba(20,20,30,0.95);
  border-radius:8px; border:1px solid rgba(100,180,255,0.4);
  color:white;
}

button {
  background:#69b7ff; border:none; border-radius:10px;
  padding:16px; width:100%;
  font-size:1.1rem; font-weight:600;
  cursor:pointer; margin-top:14px;
}
button:hover { background:#8ccaff; }

.copyBtn {
  background:#4cd964; margin-top:6px;
  padding:12px; border-radius:8px;
  width:100%; cursor:pointer;
  transition:0.25s;
}
.copyBtn.copied {
  background:#2fa74d !important;
  color:#fff !important;
  transform:scale(0.97);
}

.result-card {
  margin-top:40px; padding:20px;
  background:rgba(20,20,30,0.9);
  border-radius:12px;
  border:1px solid rgba(100,180,255,0.3);
}

.label { font-weight:600; color:#69b7ff; margin-top:12px; }

.result-field {
  padding:14px; min-height:50px;
  background:rgba(20,20,30,0.95);
  border-radius:8px;
  border:1px solid rgba(100,180,255,0.4);
  color:white; margin-top:4px;
  white-space:pre-wrap;
}

.pixel-counter {
  text-align:right; font-size:14px; color:#ccc;
  margin-bottom:6px;
}

.over-limit {
  border:2px solid red !important;
  box-shadow:0 0 8px red;
}

/* ===================== FOOTER ===================== */
footer {
  background: rgba(17,18,23,0.95);
  color: #bbb;
  text-align: center;
  padding: 30px;
  border-top: 1px solid #2b2d33;
  font-size: 0.9rem;
  box-shadow: 0 0 20px rgba(0,153,255,0.25);
  animation: footerGlow 6s ease-in-out infinite alternate;
}
@keyframes footerGlow {
  0% { box-shadow: 0 0 20px rgba(0,153,255,0.25); }
  50% { box-shadow: 0 0 40px rgba(0,180,255,0.55); }
  100% { box-shadow: 0 0 25px rgba(0,153,255,0.25); }
}



</style>
</head>

<body>

<header>
  <div style="display:flex;align-items:center;">
    <img src="logo.png" />
    <h1>MySCOGenerator</h1>
  </div>

  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="single.html">Single</a>
    <a href="batch.html">Batch</a>
  </nav>
</header>

<div class="card">
  <h2 style="text-align:center;color:#69b7ff;">Batch Topic Generator</h2>

  <textarea id="topicList" placeholder="Enter one topic per line..."></textarea>

  <div class="pixel-row">
    <div class="pixel-box">
      <label>Title Px</label>
      <input type="number" id="titleLimit" value="580" />
    </div>
    <div class="pixel-box">
      <label>Description Px</label>
      <input type="number" id="descLimit" value="990" />
    </div>
  </div>

  <button onclick="startBatch()">Generate All</button>
  <button onclick="downloadCSV()">Download CSV</button>
  <button onclick="resetBatch()">Reset</button>

  <div id="results"></div>
</div>

<script>
const API_URL = "https://seo-backend-51av.onrender.com/generate";
let batchData = [];

function px(t){
  const c=document.createElement("canvas");
  const x=c.getContext("2d");
  x.font="16px Inter";
  return Math.round(x.measureText(t).width);
}

function expandTitle(text, limit){
  let out = text.trim();

  while(px(out) > limit && out.includes(" "))
    out = out.replace(/\s+\S+$/, "").trim();

  while(px(out) > limit)
    out = out.slice(0, -1);

  const boosters=[
    "durable build","premium materials","ergonomic profile",
    "modern fit","everyday performance","lightweight design",
    "refined detailing","versatile use"
  ];

  for(const b of boosters){
    const test = out+" "+b;
    if(px(test) < limit - 6) out = test;
  }

  while(px(out) > limit - 6)
    out = out.slice(0, -1);

  return out.trim();
}

function trimDesc(t, l){
  let out = t.trim();

  while(px(out) > l && out.includes(" "))
    out = out.replace(/\s+\S+$/, "").trim();

  out = out.replace(/,\s*$/, "");
  out = out.replace(/and\s*\.?$/, "");

  out = out.replace(/,?\s*\.$/, ".");

  if(!/[.!?]$/.test(out)) out += ".";

  return out.trim();
}

function attachCounter(el, limit, counter){
  function update(){
    const w = px(el.innerText.trim());
    counter.innerText=w+"px";
    counter.style.color = w>limit ? "red" : "#ccc";
    if(w>limit) el.classList.add("over-limit");
    else el.classList.remove("over-limit");
  }
  el.addEventListener("input",update);
  update();
}

function copyWithFeedback(btn,id){
  navigator.clipboard.writeText(
    document.getElementById(id).innerText.trim()
  );
  btn.classList.add("copied");
  btn.innerText="Copied!";
  setTimeout(()=>{
    btn.classList.remove("copied");
    btn.innerText="Copy";
  },800);
}

async function startBatch(){
  const list = topicList.value.trim();
  if(!list) return alert("Enter topics first.");

  const topics = list.split("\n").map(t=>t.trim()).filter(Boolean);
  const titleLimitNum = parseInt(titleLimit.value);
  const descLimitNum  = parseInt(descLimit.value);

  results.innerHTML="";
  batchData=[];

  for(const topic of topics){
    const r = await fetch(API_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ topic, maxLength: descLimitNum })
    });
    const data = await r.json();

    const finalTitle = expandTitle(data.title,titleLimitNum);
    const finalDesc  = trimDesc(data.description,descLimitNum);
    const finalKeys  = data.keywords || "";

    const id = Math.random().toString(36).slice(2);

    batchData.push({
      topic,
      title: finalTitle,
      description: finalDesc,
      keywords: finalKeys
    });

    const card=document.createElement("div");
    card.className="result-card";

    card.innerHTML = `
      <h3>${topic}</h3>

      <div class="label">Title</div>
      <div class="pixel-counter" id="tc_${id}"></div>
      <div class="result-field" id="title_${id}" contenteditable="true">${finalTitle}</div>
      <button class="copyBtn" onclick="copyWithFeedback(this,'title_${id}')">Copy</button>

      <div class="label">Description</div>
      <div class="pixel-counter" id="dc_${id}"></div>
      <div class="result-field" id="desc_${id}" contenteditable="true">${finalDesc}</div>
      <button class="copyBtn" onclick="copyWithFeedback(this,'desc_${id}')">Copy</button>

      <div class="label">Keywords</div>
      <div class="result-field" id="keys_${id}" contenteditable="true">${finalKeys}</div>
      <button class="copyBtn" onclick="copyWithFeedback(this,'keys_${id}')">Copy</button>
    `;

    results.appendChild(card);

    attachCounter(document.getElementById(`title_${id}`), titleLimitNum, document.getElementById(`tc_${id}`));
    attachCounter(document.getElementById(`desc_${id}`),  descLimitNum,  document.getElementById(`dc_${id}`));
  }
}

function downloadCSV(){
  if(!batchData.length) return alert("Generate first!");

  const rows=[
    ["Topic","Title","Description","Keywords"],
    ...batchData.map(r=>[
      r.topic.replace(/"/g,'""'),
      r.title.replace(/"/g,'""'),
      r.description.replace(/"/g,'""'),
      r.keywords.replace(/"/g,'""')
    ])
  ];

  const csv = rows.map(r=>`"${r.join('","')}"`).join("\n");
  const blob = new Blob([csv],{type:"text/csv"});
  const url = URL.createObjectURL(blob);

  const a=document.createElement("a");
  a.href=url;
  a.download="batch_seo.csv";
  a.click();
}

function resetBatch(){
  topicList.value="";
  titleLimit.value=580;
  descLimit.value=990;
  results.innerHTML="";
  batchData=[];
}
</script>
    <footer>
    © 2025 MySCOGenerator — Built for better SEO automation.
    </footer>


</body>
</html>
