<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact – MySCOGenerator</title>

<style>
body {
  margin: 0;
  font-family: "Inter", Arial, sans-serif;
  background: url("ai-wave.jpg") no-repeat center center/cover;
  color: #f5f5f5;
}

/* Header */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  height: 70px;
  padding: 0 40px;
  background: rgba(25, 20, 40, 0.95);
  border-bottom: 1px solid #2b2d33;
  position: sticky;
  top: 0;
  z-index: 10;
  backdrop-filter: blur(10px);
  box-shadow: 0 0 25px rgba(100,170,255,0.35);
}
header img {
  height: 50px;
  transform: scale(1.3);
  filter: drop-shadow(0 0 14px rgba(255,255,255,0.7));
}
header h1 {
  color: white;
  font-size: 1.6rem;
  margin-left: 18px;
  font-weight: 700;
}
nav a {
  color: #f5f5f5;
  margin-left: 30px;
  text-decoration: none;
}
nav a:hover { color: #66c2ff; }

/* Contact */
.contact-container {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: calc(100vh - 180px);
  padding: 80px 20px;
}
.contact-box {
  background: rgba(30, 30, 40, 0.7);
  border: 1px solid rgba(120,180,255,0.4);
  border-radius: 16px;
  max-width: 600px;
  width: 100%;
  padding: 40px 50px;
  text-align: center;
  backdrop-filter: blur(12px);
  box-shadow: 0 0 40px rgba(120,170,255,0.35);
}
.contact-box h2 {
  color: #66c2ff;
  margin-bottom: 25px;
  font-size: 2rem;
}
label {
  display: block;
  text-align: left;
  margin-bottom: 8px;
  font-weight: 500;
}
input, textarea {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid rgba(120,150,255,0.4);
  background: rgba(45, 45, 60, 0.6);
  color: #fff;
  margin-bottom: 20px;
  font-size: 15px;
}
textarea {
  height: 140px;
  resize: none;
}
button {
  background-color: #66c2ff;
  border: none;
  color: #000;
  font-weight: 700;
  font-size: 1rem;
  padding: 14px;
  border-radius: 12px;
  cursor: pointer;
  width: 100%;
  box-shadow: 0 0 20px rgba(102,194,255,0.6);
}
button:hover {
  background-color: #8dd4ff;
}
#confirmation {
  display: none;
  margin-top: 15px;
  font-weight: 600;
}

/* Footer */
footer {
  background: rgba(17,18,23,0.95);
  color: #bbb;
  text-align: center;
  padding: 30px;
  border-top: 1px solid #2b2d33;
  font-size: 0.9rem;
}
</style>
</head>

<body>

<header>
  <div style="display:flex;align-items:center;">
    <img src="logo.png" alt="MySCOGenerator Logo" />
    <h1>MySCOGenerator</h1>
  </div>
  <nav>
    <a href="index.html">Home</a>
    <a href="single.html">Single</a>
    <a href="batch.html">Batch</a>
    <a href="about.html">About</a>


  </nav>
</header>

<section class="contact-container">
  <div class="contact-box">
    <h2>Contact Us</h2>

 <form
  action="https://formspree.io/f/mwpgzylj"
  method="POST"
  id="contactForm"
>
  <label>Your Name</label>
  <input type="text" name="name" required>

  <label>Your E-Mail</label>
  <input type="email" name="email" required>

  <label>Your Message</label>
  <textarea name="message" required></textarea>

  <input type="text" name="_gotcha" style="display:none">

  <button type="submit">Send Message</button>
</form>

<p id="confirmation" style="display:none;color:#8fffba;margin-top:15px;">
  ✅ Thank you. Your message has been sent.
</p>

  </div>
</section>

<footer>
  © 2025 MySCOGenerator — Built for better SEO automation.
</footer>
<script>
const form = document.getElementById("contactForm");
const confirmation = document.getElementById("confirmation");

form.addEventListener("submit", async function (e) {
  e.preventDefault();

  const res = await fetch(form.action, {
    method: "POST",
    body: new FormData(form),
    headers: { Accept: "application/json" }
  });

  if (res.ok) {
    form.style.display = "none";
    confirmation.style.display = "block";
  }
});
</script>

</body>
</html>
